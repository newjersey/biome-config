name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm test

  # Consumers can run any Biome version in our peer range, so the config must also work on the
  # lowest one. If this fails, raise the peerDependencies floor.
  test-peer-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run test:peer-floor
